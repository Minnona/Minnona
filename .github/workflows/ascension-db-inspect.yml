name: Ascension DB Inspect

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch raw class page
        run: |
          python - <<'PY'
          import re
          import ssl
          import urllib.request
          from pathlib import Path

          url = "https://db.ascension.gg/?spells=7.12"
          out = Path("ascension-db-work")
          out.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept-Language": "en-US,en;q=0.9"})
          with urllib.request.urlopen(req, timeout=60, context=ssl.create_default_context()) as response:
              raw = response.read()
              status = response.status
              final_url = response.geturl()
              content_type = response.headers.get("Content-Type")
          html = raw.decode("utf-8", errors="replace")
          (out / "class12.html").write_text(html, encoding="utf-8")
          lines = [
              f"status={status}", f"final_url={final_url}", f"bytes={len(raw)}", f"chars={len(html)}",
              f"content_type={content_type}", f"listview_count={html.count('new Listview(')}",
              f"spell_link_count={len(re.findall(r'\\?spell=\\d+', html))}", ""
          ]
          for pattern in ["new Listview(", "data:", "template: 'spell'", 'template: "spell"', "g_spells", "lv_spells"]:
              positions = [m.start() for m in re.finditer(re.escape(pattern), html)]
              lines.append(f"PATTERN {pattern!r}: {positions[:30]}")
          lines.append("")
          for i, match in enumerate(re.finditer(re.escape("new Listview("), html)):
              start = max(0, match.start() - 300)
              end = min(len(html), match.start() + 20000)
              lines.extend([f"===== LISTVIEW {i + 1} @ {match.start()} =====", html[start:end], ""])
          (out / "inspection.txt").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines[:20]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ascension-db-inspection
          path: ascension-db-work/
          retention-days: 1
