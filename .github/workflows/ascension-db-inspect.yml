name: Ascension DB Full Scrape

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Restore scraper
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          from pathlib import Path

          payload = """"""
          Path("/tmp/scrape_ascension.py").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PYCODE
          python -m py_compile /tmp/scrape_ascension.py
      - name: Extract classes 12-32
        id: scrape
        continue-on-error: true
        run: |
          python /tmp/scrape_ascension.py --classes 12-32 --workers 10 --output ascension-db-output --raw-classes ascension-db-output/raw-classes
      - name: Upload complete or partial reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-db-full-reference
          path: ascension-db-output/
          if-no-files-found: error
          retention-days: 1
      - name: Fail after preserving output
        if: steps.scrape.outcome == 'failure'
        run: exit 1
